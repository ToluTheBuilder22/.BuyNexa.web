<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BuyNexa Phones Coming Soon</title>
<style>
  :root {
    --bg-color: #0d0d1a;
    --text-color: #fff;
    --highlight: #ff9900;
  }
  body {
    margin: 0; 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    position: relative;
    text-align: center;
  }
  canvas {
    position: absolute;
    top:0; left:0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
  }
  .container {
    position: relative;
    z-index: 1;
    background: rgba(0,0,0,0.7);
    border: 2px dashed var(--highlight);
    border-radius: 20px;
    padding: 40px;
    max-width: 400px;
    box-shadow: 0 0 25px var(--highlight);
    animation: glow 2s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { box-shadow: 0 0 10px var(--highlight, #ff9900); }
    to { box-shadow: 0 0 30px var(--highlight, #ff9900); }
  }
  h1 {
    font-size: 2.8rem;
    margin: 0 0 10px;
  }
  p.subtitle {
    font-size: 1.2rem;
    margin: 10px 0 25px;
    color: var(--highlight);
  }
  .countdown {
    font-size: 1.8rem;
    margin-bottom: 20px;
  }
  .notify {
    margin: 20px 0;
  }
  input[type="email"] {
    padding: 12px 15px;
    border-radius: 6px;
    border: none;
    width: 220px;
    font-size: 1rem;
    margin-right: 10px;
  }
  button.notify-btn {
    padding: 12px 20px;
    font-weight: 700;
    background: var(--highlight);
    border: none;
    border-radius: 6px;
    cursor: pointer;
    color: #000;
    transition: background 0.3s ease;
  }
  button.notify-btn:hover {
    background: #e67e00;
  }
  .social-icons {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 30px;
  }
  .social-icons a {
    font-size: 2rem;
    color: var(--highlight);
    text-decoration: none;
    transition: transform 0.3s ease;
  }
  .social-icons a:hover {
    transform: scale(1.3);
  }
  .footer-msg {
    margin-top: 35px;
    font-size: 1rem;
    color: var(--highlight);
    font-style: italic;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="container">
  <h1>BuyNexa Phones</h1>
  <p class="subtitle">📱 Coming Soon — Stay Tuned!</p>

  <div class="countdown" id="countdown">Loading countdown...</div>

  <div class="notify">
    <input type="email" id="email" placeholder="Enter your email" />
    <button class="notify-btn" onclick="notify()">Notify Me</button>
  </div>

  <div class="social-icons">
  <a href="https://www.facebook.com/buy.nexa.2025" target="_blank" aria-label="Facebook">📘</a>
  <a href="https://www.tiktok.com/@buynexa2?_t=ZM-8wZSDXNKduS&_r=1" target="_blank" aria-label="TikTok">🎵</a>
  <a href="https://youtube.com/@buynexa_23?si=fKBNaIBQvuot8D_W" target="_blank" aria-label="YouTube">▶️</a>
</div>


  <div class="footer-msg">
   <strong>BuyNexa</strong>
  </div>
</div>

<script>
  // Particle Background
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W = canvas.width = window.innerWidth;
  let H = canvas.height = window.innerHeight;

  let particles = [];
  for(let i = 0; i < 80; i++) {
    particles.push({
      x: Math.random()*W,
      y: Math.random()*H,
      r: Math.random()*2 + 1,
      dx: (Math.random()-0.5)*0.7,
      dy: (Math.random()-0.5)*0.7
    });
  }

  function drawParticles() {
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle = '#ff9900';
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
      p.x += p.dx;
      p.y += p.dy;
      if(p.x < 0 || p.x > W) p.dx *= -1;
      if(p.y < 0 || p.y > H) p.dy *= -1;
    });
    requestAnimationFrame(drawParticles);
  }
  drawParticles();

  // Countdown Timer - set duration here in hours
  const countdownElem = document.getElementById('countdown');
  const durationHours = 10; // set how many hours countdown lasts
  const endTime = new Date().getTime() + durationHours * 60 * 60 * 1000;

  function updateCountdown() {
    let now = new Date().getTime();
    let distance = endTime - now;

    if (distance <= 0) {
      countdownElem.innerText = "Now Available!";
      return;
    }

    let h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000*60*60));
    let m = Math.floor((distance % (1000 * 60 * 60)) / (1000*60));
    let s = Math.floor((distance % (1000 * 60)) / 1000);

    countdownElem.innerText = `${h}h ${m}m ${s}s`;
  }

  setInterval(updateCountdown, 1000);
  updateCountdown();

  // Notify button opens WhatsApp with message including email
  function notify() {
    const email = document.getElementById('email').value.trim();
    if (!email) {
      alert("Please enter your email.");
      return;
    }
    const msg = `Hello BuyNexa! Please notify me when Phones go live. My email: ${email}`;
    const waLink = `https://wa.me/2349154609367?text=${encodeURIComponent(msg)}`;
    window.open(waLink, '_blank');
  }

  // Resize canvas on window resize
  window.addEventListener('resize', () => {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  });
</script>

</body>
</html>
